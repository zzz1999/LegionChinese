name: Check and release addon
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: addon-releases
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select release version
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const { pathToFileURL } = require('node:url');
            const { resolveReleaseVersion } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release.mjs`).href);
            const { version: baseVersion } = JSON.parse(await readFile('package.json', 'utf8'));
            const version = await resolveReleaseVersion({ github, context, baseVersion });
            core.setOutput('publish', version !== null ? 'true' : 'false');
            if (version === null) {
              core.notice('Skipping release: newer source has already been published.');
              await core.summary.addHeading('Release skipped').addRaw('Newer source has already been published.').write();
            } else {
              core.setOutput('version', version);
            }
      - name: Package addon
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/package.ps1 -Version $env:PACKAGE_VERSION
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: actions/github-script@v9
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const { pathToFileURL } = require('node:url');
            const { publishRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release.mjs`).href);
            const version = process.env.PACKAGE_VERSION;
            const archiveName = `LegionChinese-${version}.zip`;
            const assets = await Promise.all([archiveName, `${archiveName}.sha256`].map(async name => ({
              name, data: await readFile(`dist/${name}`)
            })));
            const changelog = await readFile('CHANGELOG.md', 'utf8');
            const release = await publishRelease({ github, context, version, assets, changelog });
            if (release) {
              await core.summary.addHeading('Release').addLink(release.tag_name, release.html_url).write();
            } else {
              core.notice('Skipping release: newer source has already been published.');
              await core.summary.addHeading('Release skipped').addRaw('Newer source has already been published.').write();
            }
