name: Check and release addon
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run check:package
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: addon-releases
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select release version
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const { readFile, mkdir, writeFile } = require('node:fs/promises');
            const { pathToFileURL } = require('node:url');
            const { resolveReleaseVersion, prepareReleaseNotes } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release.mjs`).href);
            const { version: baseVersion } = JSON.parse(await readFile('package.json', 'utf8'));
            const version = await resolveReleaseVersion({ github, context, baseVersion });
            core.setOutput('publish', version !== null ? 'true' : 'false');
            if (version === null) {
              core.notice('Skipping release: newer source has already been published.');
              await core.summary.addHeading('Release skipped').addRaw('Newer source has already been published.').write();
            } else {
              const changelog = await readFile('CHANGELOG.md', 'utf8');
              const notes = await prepareReleaseNotes({ github, context, version, changelog });
              await mkdir('.release', { recursive: true });
              await writeFile('.release/notes.json', JSON.stringify({ version, notes }));
              core.setOutput('version', version);
            }
      - name: Package addon
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/package.ps1 -Version $env:PACKAGE_VERSION -ReleaseNotesPath .release/notes.json
      - name: Publish release
        id: release
        if: steps.version.outputs.publish == 'true'
        uses: actions/github-script@v9
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const { pathToFileURL } = require('node:url');
            const { publishRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release.mjs`).href);
            const version = process.env.PACKAGE_VERSION;
            const archiveName = `LegionChinese-${version}.zip`;
            const assets = await Promise.all([archiveName, `${archiveName}.sha256`].map(async name => ({
              name, data: await readFile(`dist/${name}`)
            })));
            const metadata = JSON.parse(await readFile('.release/notes.json', 'utf8'));
            if (metadata.version !== version) throw new Error('Release notes version mismatch.');
            const release = await publishRelease({ github, context, version, assets, releaseNotes: metadata.notes });
            if (release) {
              core.setOutput('tag', release.tag_name);
              await core.summary.addHeading('Release').addLink(release.tag_name, release.html_url).write();
            } else {
              core.notice('Skipping release: newer source has already been published.');
              await core.summary.addHeading('Release skipped').addRaw('Newer source has already been published.').write();
            }
      - name: Upload to CurseForge
        if: steps.release.outputs.tag != ''
        uses: actions/github-script@v9
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { publishCurseForge } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/curseforge.mjs`).href);
            const result = await publishCurseForge({ github, context,
              version: process.env.PACKAGE_VERSION, token: process.env.CF_API_TOKEN });
            const messages = {
              'not-configured': '尚未配置 CF_API_TOKEN，已跳过 CurseForge 上传。配置步骤见 docs/CURSEFORGE.md。',
              'superseded': '已有更新的 GitHub Release，已跳过旧版的 CurseForge 上传。',
              'already-uploaded': `此版本已上传至 CurseForge，文件 ID：${result.fileId}。`,
              'uploaded': `已上传至 CurseForge，文件 ID：${result.fileId}。公开下载时间取决于 CurseForge 审核状态。`,
            };
            core.notice(messages[result.status]);
            await core.summary.addHeading('CurseForge').addRaw(messages[result.status]).write();
